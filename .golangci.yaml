version: "2"
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - dogsled
    - errorlint
    - exhaustruct
    - exhaustruct_v5
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - godot
    - importas
    - intrange
    - ireturn
    - maintidx
    - nlreturn
    - paralleltest
    - prealloc
    - predeclared
    - tagliatelle
    - varnamelen
    - wsl
    - wsl_v5

    # Consider enabling
    - gocyclo
    - wrapcheck
  settings:
    depguard:
      rules:
        main:
          list-mode: strict
          allow:
            - $gostd
            - moqueries.org/deephash
            - moqueries.org/runtime
    revive:
      rules:
        - name: var-naming
          disabled: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
      initialisms:
        - -ID
  exclusions:
    generated: lax
    rules:
      - linters:
          - err113
          - forcetypeassert
          - goconst
          - gocritic
          - nestif
        path: (.+)_test.go
      - linters:
          - deadcode
          - revive
          - staticcheck
          - unused
        path: testpkg
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(moqueries.org/runtime)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
